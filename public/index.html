<!DOCTYPE html>
<html>
<head>
    <title>Bang! Online</title>
</head>
<body>
    <h1>Bang! Online</h1>
    
    <div id="login-screen">
        <input type="text" id="username" placeholder="Введи имя ковбоя...">
        <button onclick="join()">Войти в салун</button>
    </div>

    <div id="game-lobby" style="display:none;">
        <h3>Игроки в салуне:</h3>
        <ul id="player-list"></ul>
        <p>Нужно минимум 4 игрока для начала...</p>
        <button id="start-btn" style="display:none;" onclick="startGame()">Начать игру</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function join() {
            const name = document.getElementById('username').value;
            if (name) {
                socket.emit('joinGame', name);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-lobby').style.display = 'block';
            }
        }

        socket.on('updatePlayerList', (players) => {
            const list = document.getElementById('player-list');
            list.innerHTML = players.map(p => `<li>🤠 ${p.name}</li>`).join('');

            const startBtn = document.getElementById('start-btn');

            if (players.length >= 2 && players[0].id === socket.id) {
                startBtn.style.display = 'block';
            } else {
                startBtn.style.display = 'none';
            }
        });
        
        function startGame(){
            socket.emit('requestStartGame');
        }

        socket.on('gameStarted', (data) => {
            const lobby = document.getElementById('game-lobby');
            lobby.innerHTML = `<h2>Игра началась!</h2>
                            <p>Твоя роль: <strong>${data.role}</strong></p>
                            <p>Твое здоровье: ❤️ ${data.hp}</p>
                            <hr>
                            <p>Ожидаем раздачи карт...</p>`;
        });
    </script>
</body>
</html>
